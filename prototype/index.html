<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#11151b">
<title>MPC Master Mixer — interface tactile</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#1a2029;--panel-hi:#222a35;--well:#111720;--line:#35404d;--text:#edf2f7;--muted:#94a1b1;--amber:#e9ad45;--green:#55c68a;--red:#e36e70;--blue:#70a9dc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{color:inherit}
.app{height:100dvh;display:flex;flex-direction:column;min-height:0}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:#171c24;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:850;letter-spacing:.075em;white-space:nowrap}.brand b{color:var(--amber)}
.project{min-width:0;margin-left:8px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-spacer{flex:1}
.mode{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #66512e;border-radius:6px;color:#f1c879;background:#342a1c;font-size:10px;font-weight:800;letter-spacing:.07em;white-space:nowrap}
.mode:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px #e9ad4580}
.toolbar{display:flex;gap:6px}
.tool{min-height:36px;padding:0 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel-hi);font-size:11px;font-weight:700}
.tool:active,.toggle:active{transform:translateY(1px)}
.workspace{display:flex;flex:1;min-height:0;gap:0}
.scroll-area{flex:1;min-width:0;touch-action:pan-x pan-y;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-color:#596575 #1a2029;scrollbar-width:thin}
.strips{height:100%;width:max-content;display:flex;gap:8px;padding:10px}
.channel{width:180px;min-width:180px;height:100%;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px;background:linear-gradient(180deg,#202731,#191f28);border:1px solid var(--line);border-radius:8px}
.channel.selected{border-color:var(--amber);box-shadow:inset 0 0 0 1px #e9ad4540}
.channel{transition:opacity 120ms ease,border-color 120ms ease}.channel.mix-muted{opacity:.48}.channel.mix-not-solo{opacity:.34}
.channel:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.channel-head{display:flex;align-items:center;justify-content:space-between;min-height:30px;gap:5px}
.channel-title{font-weight:850;letter-spacing:.03em;font-size:13px}
.channel-type{font-size:9px;color:var(--muted);letter-spacing:.08em}
.channel-number{color:var(--amber);font-variant-numeric:tabular-nums}
.block{padding:7px;background:var(--panel-hi);border:1px solid #303a47;border-radius:6px}
.block-title{margin-bottom:6px;color:#aeb9c7;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fx-row{display:flex;gap:5px}
.fx{flex:1;min-width:0;padding:6px 2px;border:1px solid #3b4654;border-radius:4px;background:#2b3542;color:#cbd4df;text-align:center;font-size:9px;font-weight:750}
.fx.off{color:#778392;background:#202833}
.eq{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px}
.band{min-width:0;text-align:center;color:var(--muted);font-size:9px}
.band input{display:block;width:18px;height:64px;margin:3px auto;accent-color:var(--amber);writing-mode:vertical-lr;direction:rtl}
.band output{display:block;color:var(--text);font-size:9px;font-variant-numeric:tabular-nums}
.pan{display:flex;align-items:center;gap:7px}
.pan span{color:var(--muted);font-size:9px;font-weight:800}
.pan input{width:100%;min-width:0;accent-color:var(--amber)}
.aux{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.aux label{text-align:center;color:var(--muted);font-size:9px}
.aux input{display:block;width:100%;margin:5px 0 1px;accent-color:var(--blue)}
.aux output{color:var(--text);font-size:9px;font-variant-numeric:tabular-nums}
.switches{display:flex;gap:6px}
.toggle{flex:1;min-height:34px;border:1px solid #414c59;border-radius:5px;background:#252e39;font-size:10px;font-weight:850;letter-spacing:.04em}
.toggle.active{border-color:var(--amber);background:#574324;color:#ffe0a2}
.meter-panel{display:grid;gap:4px;padding:5px 6px;background:#111720;border:1px solid #303a47;border-radius:5px}
.meter-row{display:grid;grid-template-columns:24px 1fr 25px;align-items:center;gap:5px}
.meter-label{color:var(--muted);font-size:8px;font-weight:850}
.meter-track{position:relative;height:6px;overflow:hidden;border-radius:3px;background:#28323e}
.meter-fill{display:block;width:0;height:100%;background:linear-gradient(90deg,#438f6d 0 68%,#b18c43 84%,#c75c55 100%);transition:width 100ms linear}
.meter-hold{position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;box-shadow:0 0 3px #fff;transform:translateX(-1px)}
.meter-value{color:#cbd4df;text-align:right;font-size:8px;font-variant-numeric:tabular-nums}
.clip{padding:1px 3px;border:1px solid #5b4244;border-radius:3px;color:#778392;text-align:center;font-size:8px;font-weight:900;background:transparent;cursor:pointer}
.clip.active{border-color:var(--red);background:#57292c;color:#fff;box-shadow:0 0 7px #e36e7080}
.clip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.fader-area{flex:1;min-height:110px;display:flex;align-items:stretch;justify-content:center;gap:8px;padding:8px 6px 4px;background:var(--well);border:1px solid #303a47;border-radius:6px}
.scale{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;color:#8390a0;font-size:8px}
.fader{height:100%;min-height:100px;width:34px;margin:0;accent-color:var(--amber);writing-mode:vertical-lr;direction:rtl}
.fader-readout{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:3px}
.db{color:var(--amber);font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}
.value{color:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
.master-dock{width:194px;min-width:194px;padding:10px 10px 10px 0;border-left:1px solid #303a47;background:#141920}
.master-dock .channel{width:100%;min-width:0;border-color:#80602f;background:linear-gradient(180deg,#29271f,#1c2027)}
.master-dock .fader{width:42px}
.bottom{height:34px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line);background:#171c24;color:var(--muted);font-size:10px}
.bottom strong{color:#e9c47e;font-weight:750}
.bottom .hint{margin-left:auto}
@media(max-width:650px){.topbar{height:54px;padding:0 9px;gap:7px}.project,.toolbar .optional{display:none}.brand{font-size:13px}.mode{font-size:9px;padding:6px 7px}.master-dock{width:142px;min-width:142px;padding:8px 7px 8px 0}.strips{padding:8px}.channel{width:168px;min-width:168px}.master-dock .channel{width:100%;min-width:0}.bottom{font-size:9px;padding:0 8px}}
@media(max-height:650px){.topbar{height:48px}.channel{gap:4px;padding:6px}.block{padding:5px}.band input{height:42px}.fader-area{min-height:80px}.fader{min-height:75px}.bottom{height:27px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
 <div class="brand">MPC <b>MASTER MIXER</b></div>
 <div class="project">SESSION · PROJET DE DÉMONSTRATION</div>
 <div class="top-spacer"></div>
 <div class="mode">MODE DÉMO · HORS LIGNE</div>
 <div class="toolbar"><button class="tool optional" id="prev" type="button">◀ BANQUE</button><button class="tool optional" id="next" type="button">BANQUE ▶</button><button class="tool" id="meterDemo" type="button" aria-pressed="false">DÉMO MÈTRES : OFF</button><button class="tool" id="reset" type="button">RÉINITIALISER</button></div>
</header>
<main class="workspace">
 <div class="scroll-area" id="scrollArea" aria-label="Tranches de canaux"><div class="strips" id="strips"></div></div>
 <aside class="master-dock" aria-label="Tranche Master"><div id="master"></div></aside>
</main>
<footer class="bottom"><strong>SIMULATION LOCALE</strong><span>Les réglages restent dans cette page uniquement.</span><span class="hint">Glisser horizontalement pour parcourir les 16 pistes</span></footer>
</div>
<script>
const strips=document.getElementById('strips');
const labels=['KICK','SNARE','HI-HAT','PERC','BASS','SYNTH 1','SYNTH 2','KEYS','PAD','GUITAR','VOX','FX 1','FX 2','AUDIO 1','AUDIO 2','AUDIO 3'];
const defaults=()=>({volume:100,pan:0,eq:[0,0,0,0,0,0],aux:[0,0,0,0],mute:false,solo:false});
const state=Array.from({length:16},defaults);
const masterState=defaults();
function meter(){return '<div class="meter-panel" aria-label="Mesures simulées"><div class="meter-row"><span class="meter-label">PEAK</span><div class="meter-track"><i class="meter-fill" data-meter="peak"></i><i class="meter-hold" data-meter-hold></i></div><output class="meter-value" data-meter-value="peak">0%</output></div><div class="meter-row"><span class="meter-label">RMS</span><div class="meter-track"><i class="meter-fill" data-meter="rms"></i></div><output class="meter-value" data-meter-value="rms">0%</output></div><div class="meter-row"><span class="meter-label">CLIP</span><span></span><button class="clip" data-clip type="button" aria-label="Écrêtage inactif" title="Effacer Clip et Peak Hold">OFF</button></div></div>'}
function makeStrip(index,isMaster=false){
 const data=isMaster?masterState:state[index];
 const name=isMaster?'MASTER':labels[index];
 const el=document.createElement('section');
 el.className='channel'+(!isMaster&&index===0?' selected':'');
 el.dataset.channel=isMaster?'master':index;
 el.tabIndex=isMaster?-1:0;
 el.setAttribute('role','group');
 el.setAttribute('aria-label',isMaster?'Tranche Master':'Tranche '+(index+1)+' '+name);
 el.addEventListener('focus',()=>{if(!isMaster)selectChannel(index)});
 el.innerHTML=`
  <div class="channel-head"><span class="channel-title">${name}</span><span class="channel-type">${isMaster?'STEREO':'<span class="channel-number">'+String(index+1).padStart(2,'0')+'</span> · AUDIO'}</span></div>
  <div class="block"><div class="block-title">Inserts · effets</div><div class="fx-row"><button class="fx" type="button" aria-pressed="true" aria-label="Insert 1, placeholder activé" title="Placeholder visuel uniquement">INSERT 1</button><button class="fx off" type="button" aria-pressed="false" aria-label="Insert 2, placeholder désactivé" title="Placeholder visuel uniquement">INSERT 2</button></div></div>
  <div class="block"><div class="block-title">EQ paramétrique · 6 bandes</div><div class="eq">${['LF','LM','M1','M2','HM','HF'].map((band,i)=>`<label class="band">${band}<input data-eq="${i}" type="range" min="-12" max="12" step="0.5" value="0" aria-label="EQ ${band} ${name}"><output>0.0</output></label>`).join('')}</div></div>
  <div class="block"><div class="block-title">Panoramique</div><div class="pan"><span>L</span><input data-pan type="range" min="-100" max="100" value="0" aria-label="Panoramique ${name}"><span>R</span><output class="pan-value" aria-live="polite">C</output></div></div>
  <div class="block"><div class="block-title">Aux sends</div><div class="aux">${[1,2,3,4].map((n)=>`<label>AUX ${n}<input data-aux="${n-1}" type="range" min="0" max="100" value="0" aria-label="Aux ${n} ${name}"><output>0</output></label>`).join('')}</div></div>
  <div class="switches"><button class="toggle" data-toggle="mute" type="button" aria-pressed="false">MUTE</button><button class="toggle" data-toggle="solo" type="button" aria-pressed="false">SOLO</button></div>
  ${meter()}
  <div class="fader-area"><div class="scale"><span>+6</span><span>0</span><span>-12</span><span>-∞</span></div><input class="fader" data-volume type="range" min="0" max="127" value="100" aria-label="Volume ${name}"><div class="fader-readout"><output class="db">0.0 dB</output><span class="value">100 / 127</span></div></div>`;
 const update=()=>{
  el.querySelectorAll('[data-eq]').forEach(input=>{const v=Number(input.value);input.nextElementSibling.textContent=(v>0?'+':'')+v.toFixed(1)});
  const panValue=Number(data.pan);
  const panLabel=panValue===0?'C':panValue<0?'L '+Math.abs(panValue):'R '+panValue;
  el.querySelector('[data-pan]').title='Pan '+panLabel;
  el.querySelector('.pan-value').textContent=panLabel;
  el.querySelectorAll('[data-aux]').forEach(input=>input.nextElementSibling.textContent=input.value);
  const db=el.querySelector('.db');
  const raw=Number(data.volume);
  db.textContent=raw===0?'−∞ dB':(20*Math.log10(raw/100)).toFixed(1)+' dB';
  el.querySelector('.value').textContent=raw+' / 127';
  ['mute','solo'].forEach(k=>{const b=el.querySelector('[data-toggle="'+k+'"]');b.classList.toggle('active',data[k]);b.setAttribute('aria-pressed',String(data[k]))});
 };
 el.querySelector('[data-clip]').addEventListener('click',()=>{
 const current=Number(el.dataset.currentPeak||0);
 if(current<0.985){
  el.dataset.clipLatched='false';el.dataset.peakHold=String(current);
  renderMeter(el,current,Number(el.dataset.currentRms||0));
 }
});
 el.addEventListener('input',e=>{
  const t=e.target;
  if(!isMaster)selectChannel(index);
  if(t.matches('[data-volume]'))data.volume=Number(t.value);
  if(t.matches('[data-pan]'))data.pan=Number(t.value);
  if(t.matches('[data-eq]'))data.eq[Number(t.dataset.eq)]=Number(t.value);
  if(t.matches('[data-aux]'))data.aux[Number(t.dataset.aux)]=Number(t.value);
  update();
 });
 el.addEventListener('click',e=>{
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){if(!isMaster)selectChannel(index);const key=toggle.dataset.toggle;data[key]=!data[key];update();if(!isMaster)refreshMixVisibility();return}
  const fx=e.target.closest('.fx');if(fx){const active=fx.classList.toggle('off')===false;fx.setAttribute('aria-pressed',String(active));fx.setAttribute('aria-label',fx.textContent+', placeholder '+(active?'activé':'désactivé'));return}
  if(!isMaster&&!e.target.closest('input,button'))selectChannel(index);
 });
 function applyValues(){
  el.querySelector('[data-volume]').value=data.volume;
  el.querySelector('[data-pan]').value=data.pan;
  el.querySelectorAll('[data-eq]').forEach(x=>x.value=data.eq[Number(x.dataset.eq)]);
  el.querySelectorAll('[data-aux]').forEach(x=>x.value=data.aux[Number(x.dataset.aux)]);
  update();
 }
 applyValues();
 return el;
}
function selectChannel(index){document.querySelectorAll('.channel').forEach(x=>x.classList.toggle('selected',x.dataset.channel===String(index)))}
function refreshMixVisibility(){
 const strips=[...document.querySelectorAll('.channel:not([data-channel="master"])')];
 const soloActive=strips.some(el=>state[Number(el.dataset.channel)].solo);
 strips.forEach(el=>{
  const d=state[Number(el.dataset.channel)];
  el.classList.toggle('mix-muted',d.mute);
  el.classList.toggle('mix-not-solo',soloActive&&!d.solo);
  el.setAttribute('aria-label','Tranche '+(Number(el.dataset.channel)+1)+' '+labels[Number(el.dataset.channel)]+(d.mute?' · mute actif':'')+(d.solo?' · solo actif':''));
 });
}
for(let i=0;i<16;i++)strips.appendChild(makeStrip(i));
document.getElementById('master').appendChild(makeStrip(0,true));
let meterDemo=false;
let meterFrame=0;
const meterDemoButton=document.getElementById('meterDemo');
function renderMeter(el,peak,rms){
 const p=Math.max(0,Math.min(1,peak)),r=Math.max(0,Math.min(1,rms)),clipped=p>=0.985;
 const hold=Math.max(Number(el.dataset.peakHold||0),p);
 el.dataset.currentPeak=String(p);el.dataset.currentRms=String(r);el.dataset.peakHold=String(hold);
 el.querySelector('[data-meter="peak"]').style.width=(p*100).toFixed(1)+'%';
 el.querySelector('[data-meter-hold]').style.left=(hold*100).toFixed(1)+'%';
 el.dataset.clipLatched=String(el.dataset.clipLatched==='true'||clipped);
 el.querySelector('[data-meter="rms"]').style.width=(r*100).toFixed(1)+'%';
 el.querySelector('[data-meter-value="peak"]').textContent=Math.round(p*100)+'%';
 el.querySelector('[data-meter-value="rms"]').textContent=Math.round(r*100)+'%';
 const clip=el.querySelector('[data-clip]');const latched=el.dataset.clipLatched==='true';clip.textContent=latched?'CLIP':'OFF';clip.classList.toggle('active',latched);
 clip.setAttribute('aria-label',latched?'Écrêtage simulé mémorisé':'Écrêtage inactif');
}
function setMeterDemo(enabled){
 meterDemo=enabled;meterDemoButton.setAttribute('aria-pressed',String(enabled));
 meterDemoButton.textContent='DÉMO MÈTRES : '+(enabled?'ON':'OFF');
 if(!enabled)document.querySelectorAll('.channel').forEach(el=>{el.dataset.peakHold='0';el.dataset.clipLatched='false';renderMeter(el,0,0)});
}
meterDemoButton.addEventListener('click',()=>setMeterDemo(!meterDemo));
setInterval(()=>{
 if(!meterDemo)return;
 meterFrame+=0.11;
 document.querySelectorAll('.channel').forEach((el,i)=>{
  const peak=0.48+0.49*Math.abs(Math.sin(meterFrame+i*0.73));
  const rms=peak*(0.48+0.18*Math.abs(Math.sin(meterFrame*0.61+i)));
  renderMeter(el,peak,rms);
 });
},120);
document.getElementById('prev').addEventListener('click',()=>document.getElementById('scrollArea').scrollBy({left:-560,behavior:'smooth'}));
document.getElementById('next').addEventListener('click',()=>document.getElementById('scrollArea').scrollBy({left:560,behavior:'smooth'}));
document.getElementById('reset').addEventListener('click',()=>{
 setMeterDemo(false);
 state.forEach((s,i)=>Object.assign(s,defaults()));
 Object.assign(masterState,defaults());
 document.querySelectorAll('.channel').forEach(el=>{
  const idx=el.dataset.channel==='master'?null:Number(el.dataset.channel);
  const d=idx===null?masterState:state[idx];
  el.querySelector('[data-volume]').value=d.volume;el.querySelector('[data-pan]').value=d.pan;
  el.querySelectorAll('[data-eq]').forEach(x=>x.value=d.eq[Number(x.dataset.eq)]);
  el.querySelectorAll('[data-aux]').forEach(x=>x.value=d.aux[Number(x.dataset.aux)]);
  el.querySelectorAll('[data-toggle]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});
  el.querySelectorAll('.fx').forEach((x,i)=>{const active=i===0;x.classList.toggle('off',!active);x.setAttribute('aria-pressed',String(active));x.setAttribute('aria-label',x.textContent+', placeholder '+(active?'activé':'désactivé'))});
  el.querySelector('.db').textContent='0.0 dB';el.querySelector('.value').textContent='100 / 127';
  el.querySelectorAll('[data-eq]').forEach(x=>x.nextElementSibling.textContent='0.0');
  el.querySelectorAll('[data-aux]').forEach(x=>x.nextElementSibling.textContent='0');
  el.querySelector('[data-volume]').dispatchEvent(new Event('input',{bubbles:true}));
 });
 refreshMixVisibility();
});
</script>
</body>
</html>
