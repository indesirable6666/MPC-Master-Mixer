<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#11151b">
<title>MPC Master Mixer — interface tactile</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#1a2029;--panel-hi:#222a35;--well:#111720;--line:#35404d;--text:#edf2f7;--muted:#94a1b1;--amber:#e9ad45;--green:#55c68a;--red:#e36e70;--blue:#70a9dc}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}
button{color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.app{height:100dvh;display:flex;flex-direction:column;min-height:0}
.topbar{height:62px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:#171c24;border-bottom:1px solid var(--line)}
.brand{font-size:16px;font-weight:850;letter-spacing:.075em;white-space:nowrap}.brand b{color:var(--amber)}
.project{min-width:0;margin-left:8px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-spacer{flex:1}
.mode{display:flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid #66512e;border-radius:6px;color:#f1c879;background:#342a1c;font-size:10px;font-weight:800;letter-spacing:.07em;white-space:nowrap}
.mode:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px #e9ad4580}
.toolbar{display:flex;align-items:center;gap:6px}.view-tabs{display:flex;align-items:center;gap:4px}.view-tab{min-height:40px;padding:0 10px;font-size:10px;letter-spacing:.04em}.view-tab.active{border-color:var(--amber);background:#574324;color:#ffe0a2}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.bank-status{font-variant-numeric:tabular-nums;letter-spacing:.035em}
.tool{min-height:42px;padding:0 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel-hi);font-size:11px;font-weight:700}
.tool:active,.toggle:active{transform:translateY(1px)}
.workspace{display:flex;flex:1;min-height:0;gap:0}
.scroll-area{scroll-behavior:smooth;flex:1;min-width:0;touch-action:pan-x pan-y;overflow-x:auto;overflow-y:hidden;overscroll-behavior-x:contain;scrollbar-color:#596575 #1a2029;scrollbar-width:thin}
.strips{height:100%;width:max-content;display:flex;gap:8px;padding:10px}
.channel{width:180px;min-width:180px;height:100%;min-height:0;display:flex;flex-direction:column;gap:7px;padding:8px;background:linear-gradient(180deg,#202731,#191f28);border:1px solid var(--line);border-radius:8px}
.channel.selected{border-color:var(--amber);box-shadow:inset 0 0 0 1px #e9ad4540}.channel.selected .channel-title{color:var(--amber)}
.channel.stereo-linked{border-color:#70a9dc;box-shadow:inset 0 0 0 1px #70a9dc40}.channel.stereo-linked .channel-title{color:#9bc9f2}
.stereo-link.active{border-color:var(--blue);background:#243d53;color:#d6ebff}
.channel{transition:opacity 120ms ease,border-color 120ms ease}.channel.mix-muted{opacity:.48}.channel.mix-not-solo{opacity:.34}
.channel:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.channel-head{display:flex;align-items:center;justify-content:space-between;min-height:30px;gap:5px}
.channel-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:850;letter-spacing:.03em;font-size:13px}.channel-type{flex-shrink:0}
.channel-type{font-size:9px;color:var(--muted);letter-spacing:.08em}
.channel-number{color:var(--amber);font-variant-numeric:tabular-nums}
.block{padding:7px;background:var(--panel-hi);border:1px solid #303a47;border-radius:6px}
.block-title{margin-bottom:6px;color:#aeb9c7;font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.fx-row{display:flex;gap:5px}
.fx{flex:1;min-width:0;padding:6px 2px;border:1px solid #3b4654;border-radius:4px;background:#2b3542;color:#cbd4df;text-align:center;font-size:9px;font-weight:750}
.fx.off{color:#778392;background:#202833}
 .insert-slot{display:grid;grid-template-columns:1fr auto;gap:5px 7px;align-items:center;margin-top:6px}
 .insert-slot select{min-width:0;width:100%;padding:5px 3px;border:1px solid #3b4654;border-radius:4px;background:#202833;color:#dce4ed;font-size:9px}
 .insert-slot .fx{min-width:48px}
 .insert-drive{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr 30px;gap:6px;align-items:center;color:#9aa8b8;font-size:9px}
 .insert-drive input{width:100%;min-width:0;accent-color:#e5a64b}
 .insert-drive output{text-align:right;color:#dce4ed;font-variant-numeric:tabular-nums}
 .insert-slot select:disabled,.insert-drive input:disabled{opacity:.4}
.eq{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.band{min-width:0;text-align:center;color:#c2ccd8;font-size:10px;font-weight:750}
.band input{display:block;width:100%;height:76px;min-height:36px;margin:4px auto;accent-color:var(--amber);writing-mode:vertical-lr;direction:rtl;touch-action:pan-y}
.band output{display:block;color:var(--text);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pan{display:flex;align-items:center;gap:7px}
.pan span{color:var(--muted);font-size:9px;font-weight:800}
.pan input{width:100%;min-width:0;min-height:40px;accent-color:var(--amber);touch-action:pan-y}.stereo-balance{display:none}.channel.stereo-linked .pan:not(.stereo-balance){display:none}.channel.stereo-linked .stereo-balance{display:flex}
.aux{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.aux label{text-align:center;color:#c2ccd8;font-size:10px;font-weight:750}
.aux input{display:block;width:100%;min-height:40px;margin:5px 0 2px;accent-color:var(--blue);touch-action:pan-y}
.aux output{color:var(--text);font-size:10px;font-weight:700;font-variant-numeric:tabular-nums}
.switches{display:flex;gap:6px}
.toggle{flex:1;min-height:40px;border:1px solid #414c59;border-radius:5px;background:#252e39;font-size:10px;font-weight:850;letter-spacing:.04em}
.toggle.active{border-color:var(--amber);background:#574324;color:#ffe0a2}
.meter-panel{display:grid;gap:4px;padding:5px 6px;background:#111720;border:1px solid #303a47;border-radius:5px}
.meter-row{display:grid;grid-template-columns:24px 1fr 25px;align-items:center;gap:5px}
.meter-label{color:var(--muted);font-size:8px;font-weight:850}
.meter-track{position:relative;height:6px;overflow:hidden;border-radius:3px;background:#28323e}
.meter-fill{display:block;width:0;height:100%;background:linear-gradient(90deg,#438f6d 0 68%,#b18c43 84%,#c75c55 100%);transition:width 100ms linear}
.meter-hold{position:absolute;top:0;bottom:0;left:0;width:2px;background:#fff;box-shadow:0 0 3px #fff;transform:translateX(-1px)}
.meter-value{color:#cbd4df;text-align:right;font-size:8px;font-variant-numeric:tabular-nums}
.clip{min-width:42px;min-height:34px;padding:2px 5px;border:1px solid #5b4244;border-radius:3px;color:#778392;text-align:center;font-size:8px;font-weight:900;background:transparent;cursor:pointer}
.clip.active{border-color:var(--red);background:#57292c;color:#fff;box-shadow:0 0 7px #e36e7080}
.clip:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.fader-area{flex:1;min-height:110px;display:flex;align-items:stretch;justify-content:center;gap:8px;padding:8px 6px 4px;background:var(--well);border:1px solid #303a47;border-radius:6px}
.scale{display:flex;flex-direction:column;justify-content:space-between;padding:2px 0;color:#8390a0;font-size:8px}
.fader{appearance:none;-webkit-appearance:none;flex:none;height:100%;min-height:100px;width:42px;margin:0;padding:0;background:transparent;accent-color:var(--green);writing-mode:vertical-lr;direction:rtl;touch-action:pan-y;cursor:pointer}
.fader::-webkit-slider-runnable-track{width:8px;border:1px solid #355b49;border-radius:5px;background:linear-gradient(90deg,#14251e,#203a2d)}
.fader::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:18px;margin:0;border:2px solid #b5ebcb;border-radius:4px;background:linear-gradient(180deg,#78dba2,#34885d);box-shadow:0 2px 5px #0009}
.fader::-moz-range-track{width:8px;border:1px solid #355b49;border-radius:5px;background:linear-gradient(90deg,#14251e,#203a2d)}
.fader::-moz-range-thumb{width:26px;height:14px;border:2px solid #b5ebcb;border-radius:4px;background:linear-gradient(180deg,#78dba2,#34885d);box-shadow:0 2px 5px #0009}
.fader-readout{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;padding-bottom:3px}
.db{color:var(--green);font-size:12px;font-weight:850;font-variant-numeric:tabular-nums}
.value{color:var(--muted);font-size:9px;font-variant-numeric:tabular-nums}
.master-dock{width:194px;min-width:194px;padding:10px 10px 10px 0;border-left:1px solid #303a47;background:#141920}
.master-dock .channel{width:100%;min-width:0;border-color:#80602f;background:linear-gradient(180deg,#29271f,#1c2027)}
.master-dock .fader{width:48px}
.bottom{height:34px;flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line);background:#171c24;color:var(--muted);font-size:10px}
.bottom strong{color:#e9c47e;font-weight:750}
.bottom .hint{margin-left:auto}
@media(max-width:650px){.topbar{height:54px;padding:0 9px;gap:7px}.project,.toolbar .optional{display:none}.brand{font-size:13px}.mode{font-size:9px;padding:6px 7px}.bank-status{font-size:8px;padding:5px 6px}.master-dock{width:142px;min-width:142px;padding:8px 7px 8px 0}.strips{padding:8px}.channel{width:168px;min-width:168px}.master-dock .channel{width:100%;min-width:0}}
body[data-view="eq"] .insert-block,body[data-view="eq"] .pan-block,body[data-view="eq"] .aux-block,body[data-view="eq"] .switch-block,body[data-view="eq"] .meter-panel,body[data-view="eq"] .fader-area{display:none}body[data-view="eq"] .eq-block{flex:1;display:flex;flex-direction:column;justify-content:center}body[data-view="eq"] .eq{gap:10px}body[data-view="eq"] .band input{height:min(34vh,220px)}body[data-view="aux"] .insert-block,body[data-view="aux"] .eq-block,body[data-view="aux"] .pan-block,body[data-view="aux"] .switch-block,body[data-view="aux"] .meter-panel,body[data-view="aux"] .fader-area{display:none}body[data-view="aux"] .aux-block{flex:1;display:flex;flex-direction:column;justify-content:center}body[data-view="aux"] .aux{gap:10px}body[data-view="aux"] .aux input{height:min(30vh,180px)}body[data-view="meters"] .insert-block,body[data-view="meters"] .eq-block,body[data-view="meters"] .pan-block,body[data-view="meters"] .aux-block,body[data-view="meters"] .switch-block,body[data-view="meters"] .fader-area{display:none}body[data-view="meters"] .channel{width:150px;min-width:150px;justify-content:flex-start}body[data-view="meters"] .meter-panel{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:12px;background:#0d131a}body[data-view="meters"] .meter-row{grid-template-columns:32px 1fr 32px;gap:7px}body[data-view="meters"] .meter-track{height:18px;border:1px solid #3a4652;background:linear-gradient(90deg,#173b2d 0 65%,#4c4526 82%,#55272a 100%)}body[data-view="meters"] .meter-fill{background:linear-gradient(90deg,#35b978 0 62%,#d8b34d 82%,#f0645e 100%);box-shadow:0 0 8px #4bd28a55}body[data-view="meters"] .meter-hold{width:3px;background:#fff;box-shadow:0 0 5px #fff}body[data-view="meters"] .meter-label{font-size:10px}body[data-view="meters"] .meter-value{font-size:10px}body[data-view="meters"] .clip{min-height:42px;font-size:10px}body[data-view="meters"] .channel-head{min-height:42px}body[data-view="meters"] .channel-title{font-size:15px}body[data-view="meters"] .master-dock .channel{height:100%}
@media(max-width:650px){.view-tab{padding:0 6px;font-size:9px}.view-tabs{gap:3px}}
@media(max-width:480px){.view-tab{min-height:34px;padding:0 4px;font-size:8px}.view-tabs{gap:2px}.toolbar .optional{display:none}}
@media(prefers-reduced-motion:reduce){.scroll-area{scroll-behavior:auto}.channel,.meter-fill{transition:none}}
@media(max-height:650px){.topbar{height:48px}.channel{gap:4px;padding:6px}.block{padding:5px}.band input{height:48px}.fader-area{min-height:80px}.fader{min-height:75px}}
@media(max-width:480px){
 .topbar{gap:5px;padding:0 6px}
 .brand{font-size:10px;letter-spacing:.015em}
 .topbar>.mode{display:none}
 .toolbar{gap:3px}
 .toolbar .tool{min-height:38px;padding:0 6px;font-size:9px}
 .bank-status{max-width:72px;padding:4px 5px;font-size:7px;line-height:1.15;white-space:normal;text-align:center}
 #meterDemo{max-width:76px;white-space:normal;line-height:1.1}
 #reset{max-width:58px;white-space:normal;line-height:1.1}
 #stereoLink{max-width:76px;padding:0 4px;white-space:normal;line-height:1.1}
 .bottom{gap:7px;padding:0 7px}
 .bottom .hint{display:none}
 .bottom span:not(.hint){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>

<body data-view="mixer">
<div class="app">
<header class="topbar">
 <div class="brand">MPC <b>MASTER MIXER</b></div>
 <div class="project">SESSION · PROJET DE DÉMONSTRATION</div>
 <div class="top-spacer"></div>
 <div class="mode">MODE DÉMO · HORS LIGNE · SIMULATION LOCALE</div>
 <div class="toolbar"><nav class="view-tabs" aria-label="Pages du mixeur"><button class="tool view-tab active" type="button" data-view="mixer" aria-pressed="true">MIXER</button><button class="tool view-tab" type="button" data-view="eq" aria-pressed="false">EQ</button><button class="tool view-tab" type="button" data-view="aux" aria-pressed="false">AUX</button><button class="tool view-tab" type="button" data-view="meters" aria-pressed="false">VU MÈTRE</button></nav><button class="tool optional" id="prev" type="button" aria-label="Afficher la banque précédente" aria-controls="scrollArea bankStatus">◀ BANQUE</button><button class="tool optional" id="next" type="button" aria-label="Afficher la banque suivante" aria-controls="scrollArea bankStatus" disabled>BANQUE ▶</button><span id="bankStatus" class="mode bank-status" role="status" aria-live="polite" aria-atomic="true">BANQUE 1/2 · PISTES 1–8</span><button class="tool stereo-link" id="stereoLink" type="button" aria-pressed="false" aria-controls="audioIn1 audioIn2">LINK AUDIO 1/2 : OFF</button><button class="tool" id="audioDemo" type="button" aria-pressed="false">SIGNAL AUDIO : OFF</button><button class="tool" id="meterDemo" type="button" aria-pressed="false">DÉMO MÈTRES : OFF</button><button class="tool" id="reset" type="button">RÉINITIALISER</button></div>
</header>
<main class="workspace">
 <span id="selectionStatus" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>
 <div class="scroll-area" id="scrollArea" aria-label="Tranches de canaux"><div class="strips" id="strips"></div></div>
 <aside class="master-dock" aria-label="Tranche Master"><div id="master"></div></aside>
</main>

</div>
<script>
const strips=document.getElementById('strips');
function setView(view){document.body.dataset.view=view;document.querySelectorAll('[data-view]').forEach(button=>{if(button.tagName==='BUTTON'){const active=button.dataset.view===view;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));}})}
document.querySelectorAll('.view-tab').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
const labels=['KICK','SNARE','HI-HAT','PERC','BASS','SYNTH 1','SYNTH 2','KEYS','PAD','GUITAR','VOX','FX 1','FX 2','AUDIO 1','AUDIO 2','AUDIO 3'];
const defaultInserts=()=>[{type:'none',enabled:false,drive:2},{type:'none',enabled:false,drive:2}];
const defaults=()=>({volume:100,pan:0,eq:[0,0,0,0,0,0],aux:[0,0,0,0],mute:false,solo:false,inserts:defaultInserts()});
let audioStereoLinked=false;
let audioStereoBalance=0;
let syncingAudioPair=false;
const state=Array.from({length:16},defaults);
const masterState=defaults();
// Audio demo state is initialized before the first channel selection callback.
let audioContext=null,audioOscillator=null,audioChannelGain=null,audioPanner=null,audioMasterGain=null,audioAnalyser=null,audioMeterBuffer=null,audioMeterTimer=null;
function meter(){return '<div class="meter-panel" role="group" aria-label="Mesures simulées"><div class="meter-row"><span class="meter-label">PEAK</span><div class="meter-track" role="meter" aria-label="Peak simulé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 pour cent"><i class="meter-fill" data-meter="peak"></i><i class="meter-hold" data-meter-hold aria-hidden="true"></i></div><output class="meter-value" data-meter-value="peak">0%</output></div><div class="meter-row"><span class="meter-label">RMS</span><div class="meter-track" role="meter" aria-label="RMS simulé" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 pour cent"><i class="meter-fill" data-meter="rms"></i></div><output class="meter-value" data-meter-value="rms">0%</output></div><div class="meter-row"><span class="meter-label">CLIP</span><span></span><button class="clip" data-clip type="button" aria-label="Écrêtage inactif" title="Effacer Clip et Peak Hold">OFF</button></div></div>'}
function makeStrip(index,isMaster=false){
 const data=isMaster?masterState:state[index];
 const name=isMaster?'MASTER':labels[index];
 const el=document.createElement('section');
 el.className='channel'+(!isMaster&&index===0?' selected':'');
 el.dataset.channel=isMaster?'master':index;
 if(!isMaster&&index===13)el.id='audioIn1';
 if(!isMaster&&index===14)el.id='audioIn2';
 el.tabIndex=isMaster?-1:0;
 el.setAttribute('role','group');
 el.setAttribute('aria-label',isMaster?'Tranche Master':'Tranche '+(index+1)+' '+name);
 el.addEventListener('focus',()=>{if(!isMaster)selectChannel(index)});
 el.addEventListener('keydown',e=>{
  if(isMaster)return;
  let nextIndex=index;
  if(e.key==='ArrowLeft')nextIndex=Math.max(0,index-1);
  else if(e.key==='ArrowRight')nextIndex=Math.min(15,index+1);
  else if(e.key==='Home')nextIndex=0;
  else if(e.key==='End')nextIndex=15;
  else if(e.key==='PageUp')nextIndex=Math.max(0,index-8);
  else if(e.key==='PageDown')nextIndex=Math.min(15,index+8);
  else return;
  e.preventDefault();
  if(nextIndex!==index){
   setBank(nextIndex<8?0:1);
   document.querySelector('[data-channel="'+nextIndex+'"]').focus();
  }
 });
 el.innerHTML=`
  <div class="channel-head"><span class="channel-title">${name}</span><span class="channel-type">${isMaster?'STEREO':'<span class="channel-number">'+String(index+1).padStart(2,'0')+'</span> · AUDIO'}</span></div>
  ${isMaster ? '' : '<div class="block insert-block"><div class="block-title">Inserts · effets simulés</div><div class="insert-slot" data-insert-slot="0"><select data-insert-type="0" aria-label="Type effet insert 1"><option value="none">Vide</option><option value="softclip">Soft Clip</option></select><button class="fx off" data-insert-toggle="0" type="button" aria-pressed="false" aria-label="Activer insert 1">OFF</button><label class="insert-drive">Drive <input data-insert-drive="0" type="range" min="1" max="8" step="0.1" value="2" disabled aria-label="Drive insert 1"><output>2.0×</output></label></div><div class="insert-slot" data-insert-slot="1"><select data-insert-type="1" aria-label="Type effet insert 2"><option value="none">Vide</option><option value="softclip">Soft Clip</option></select><button class="fx off" data-insert-toggle="1" type="button" aria-pressed="false" aria-label="Activer insert 2">OFF</button><label class="insert-drive">Drive <input data-insert-drive="1" type="range" min="1" max="8" step="0.1" value="2" disabled aria-label="Drive insert 2"><output>2.0×</output></label></div></div>'}
  <div class="block eq-block"><div class="block-title">EQ paramétrique · 6 bandes</div><div class="eq">${['LF','LM','M1','M2','HM','HF'].map((band,i)=>`<label class="band">${band}<input data-eq="${i}" type="range" min="-12" max="12" step="0.5" value="0" aria-label="EQ ${band} ${name}"><output>0.0</output></label>`).join('')}</div></div>
  <div class="block pan-block"><div class="block-title">${index===13||index===14?'Panoramique / balance':'Panoramique'}</div><div class="pan"><span>L</span><input data-pan type="range" min="-100" max="100" value="0" aria-label="Panoramique ${name}"><span>R</span><output class="pan-value" aria-live="polite">C</output></div>${index===13||index===14?'<div class="pan stereo-balance"><span>L</span><input data-stereo-balance type="range" min="-100" max="100" value="0" disabled aria-label="Balance stéréo Audio In 1/2"><span>R</span><output class="balance-value" aria-live="polite">C</output></div>':''}</div>
  <div class="block aux-block"><div class="block-title">Aux sends</div><div class="aux">${[1,2,3,4].map((n)=>`<label>AUX ${n}<input data-aux="${n-1}" type="range" min="0" max="100" value="0" aria-label="Aux ${n} ${name}"><output>0</output></label>`).join('')}</div></div>
  <div class="switches switch-block"><button class="toggle" data-toggle="mute" type="button" aria-pressed="false">MUTE</button><button class="toggle" data-toggle="solo" type="button" aria-pressed="false">SOLO</button></div>
  ${meter()}
  <div class="fader-area"><div class="scale" aria-hidden="true"><span>+2</span><span>0</span><span>-12</span><span>-∞</span></div><input class="fader" data-volume type="range" min="0" max="127" value="100" aria-label="Volume ${name}" title="Valeur simulée locale — ne modifie pas le son de la MPC"><div class="fader-readout"><output class="db">0.0 dB</output><span class="value">100 / 127</span></div></div>`;
 const update=()=>{
  el.querySelectorAll('[data-eq]').forEach(input=>{
   const v=Number(input.value),text=(v>0?'+':'')+v.toFixed(1);
   input.nextElementSibling.textContent=text+' dB';
   input.setAttribute('aria-valuetext',text+' décibels');
  });
  const panValue=Number(data.pan);
  const panLabel=panValue===0?'C':panValue<0?'L '+Math.abs(panValue):'R '+panValue;
  const panInput=el.querySelector('[data-pan]');
  panInput.title='Pan '+panLabel;
  panInput.setAttribute('aria-valuetext',panValue===0?'Centre':panValue<0?'Gauche '+Math.abs(panValue)+' pour cent':'Droite '+panValue+' pour cent');
  el.querySelector('.pan-value').textContent=panLabel;
  const balanceInput=el.querySelector('[data-stereo-balance]');
  if(balanceInput){const balanceLabel=audioStereoBalance===0?'C':audioStereoBalance<0?'L '+Math.abs(audioStereoBalance):'R '+audioStereoBalance;balanceInput.value=audioStereoBalance;balanceInput.setAttribute('aria-valuetext',balanceLabel==='C'?'Centre':balanceLabel);balanceInput.title='Balance '+balanceLabel;el.querySelector('.balance-value').textContent=balanceLabel;}
  el.querySelectorAll('[data-aux]').forEach(input=>{
   input.nextElementSibling.textContent=input.value+'%';
   input.setAttribute('aria-valuetext',input.value+' pour cent');
  });
  const db=el.querySelector('.db');
  const raw=Number(data.volume);
  const dbText=raw===0?'−∞ dB':(20*Math.log10(raw/100)).toFixed(1)+' dB';
  db.textContent=dbText;
  el.querySelector('[data-volume]').setAttribute('aria-valuetext',dbText+', '+raw+' sur 127');
  el.querySelector('.value').textContent=raw+' / 127';
  ['mute','solo'].forEach(k=>{const b=el.querySelector('[data-toggle="'+k+'"]');b.classList.toggle('active',data[k]);b.setAttribute('aria-pressed',String(data[k]))});
 };
 el.querySelector('[data-clip]').addEventListener('click',()=>{
 const current=Number(el.dataset.currentPeak||0);
 if(current<0.999){
  el.dataset.clipLatched='false';el.dataset.peakHold=String(current);
  renderMeter(el,current,Number(el.dataset.currentRms||0));
 }
});
 el.addEventListener('input',e=>{
  const t=e.target;
  if(!isMaster)selectChannel(index);
  if(t.matches('[data-volume]'))data.volume=Number(t.value);
  if(t.matches('[data-pan]'))data.pan=Number(t.value);
  if(t.matches('[data-stereo-balance]')){audioStereoBalance=Number(t.value);document.querySelectorAll('[data-stereo-balance]').forEach(input=>{input.value=audioStereoBalance;input.setAttribute('aria-valuetext',audioStereoBalance===0?'Centre':(audioStereoBalance<0?'Gauche ':'Droite ')+Math.abs(audioStereoBalance)+' pour cent');input.closest('.pan').querySelector('.balance-value').textContent=audioStereoBalance===0?'C':audioStereoBalance<0?'L '+Math.abs(audioStereoBalance):'R '+audioStereoBalance;});}
  if(t.matches('[data-eq]'))data.eq[Number(t.dataset.eq)]=Number(t.value);
  if(t.matches('[data-aux]'))data.aux[Number(t.dataset.aux)]=Number(t.value);
  update();
  updateAudioDemoParameters();
  if(!isMaster&&audioStereoLinked&&!syncingAudioPair&&(index===13||index===14))syncLinkedAudioPair(index);
 });
 el.addEventListener('click',e=>{
  if(!isMaster)selectChannel(index);
  const toggle=e.target.closest('[data-toggle]');
  if(toggle){const key=toggle.dataset.toggle;data[key]=!data[key];update();if(!isMaster){refreshMixVisibility();if(audioStereoLinked&&(index===13||index===14))syncLinkedAudioPair(index)}updateAudioDemoParameters();return}
  const fx=e.target.closest('.fx');if(fx){const active=fx.classList.toggle('off')===false;fx.setAttribute('aria-pressed',String(active));fx.setAttribute('aria-label',fx.textContent+', placeholder '+(active?'activé':'désactivé'));return}
 });
 function applyValues(){
  el.querySelector('[data-volume]').value=data.volume;
  el.querySelector('[data-pan]').value=data.pan;
  el.querySelectorAll('[data-eq]').forEach(x=>x.value=data.eq[Number(x.dataset.eq)]);
  el.querySelectorAll('[data-aux]').forEach(x=>x.value=data.aux[Number(x.dataset.aux)]);
  update();
 }
 applyValues();
 return el;
}
function syncLinkedAudioPair(sourceIndex){
 if(syncingAudioPair)return;
 const targetIndex=sourceIndex===13?14:13;
 const source=state[sourceIndex],target=state[targetIndex];
 Object.assign(target,{volume:source.volume,eq:[...source.eq],aux:[...source.aux],mute:source.mute,solo:source.solo,inserts:source.inserts.map(x=>({...x}))});
 const targetEl=document.querySelector('[data-channel="'+targetIndex+'"]');
 if(!targetEl)return;
 syncingAudioPair=true;
 targetEl.querySelector('[data-volume]').value=target.volume;
 targetEl.querySelector('[data-volume]').dispatchEvent(new Event('input',{bubbles:true}));
  targetEl.querySelectorAll('[data-eq]').forEach(input=>{input.value=target.eq[Number(input.dataset.eq)];input.dispatchEvent(new Event('input',{bubbles:true}))});
  targetEl.querySelectorAll('[data-insert-type]').forEach(input=>{const slot=Number(input.dataset.insertType);input.value=target.inserts[slot].type;input.dispatchEvent(new Event('change',{bubbles:true}))});
  targetEl.querySelectorAll('[data-insert-drive]').forEach(input=>{const slot=Number(input.dataset.insertDrive);input.value=target.inserts[slot].drive;input.dispatchEvent(new Event('input',{bubbles:true}))});
  targetEl.querySelectorAll('[data-insert-toggle]').forEach(input=>{const slot=Number(input.dataset.insertToggle),desired=target.inserts[slot].enabled;if((input.getAttribute('aria-pressed')==='true')!==desired)input.click()});
 targetEl.querySelectorAll('[data-aux]').forEach(input=>{input.value=target.aux[Number(input.dataset.aux)];input.dispatchEvent(new Event('input',{bubbles:true}))});
 ['mute','solo'].forEach(key=>{const button=targetEl.querySelector('[data-toggle="'+key+'"]');button.classList.toggle('active',target[key]);button.setAttribute('aria-pressed',String(target[key]))});
 targetEl.classList.add('stereo-linked');
 syncingAudioPair=false;
 refreshMixVisibility();
}
function setAudioStereoLinked(enabled){
 audioStereoLinked=enabled;
 const button=document.getElementById('stereoLink');
 button.setAttribute('aria-pressed',String(enabled));
 button.classList.toggle('active',enabled);
 button.textContent='LINK AUDIO 1/2 : '+(enabled?'ON':'OFF');
 const left=document.getElementById('audioIn1'),right=document.getElementById('audioIn2');
 [left,right].forEach((el,i)=>{
  el.classList.toggle('stereo-linked',enabled);
  el.querySelector('.channel-type').textContent=enabled?(i===0?'STÉRÉO · L':'STÉRÉO · R'):(i===0?'14 · AUDIO':'15 · AUDIO');
  const pan=el.querySelector('[data-pan]');pan.disabled=enabled;pan.title=enabled?'Pan désactivé en mode stéréo lié':'Panoramique mono';pan.setAttribute('aria-label','Panoramique mono Audio In '+(i+1));
   const balance=el.querySelector('[data-stereo-balance]');balance.disabled=!enabled;balance.value=audioStereoBalance;balance.setAttribute('aria-valuetext',audioStereoBalance===0?'Centre':(audioStereoBalance<0?'Gauche ':'Droite ')+Math.abs(audioStereoBalance)+' pour cent');el.querySelector('.balance-value').textContent=audioStereoBalance===0?'C':audioStereoBalance<0?'L '+Math.abs(audioStereoBalance):'R '+audioStereoBalance;
 });
 if(enabled)syncLinkedAudioPair(13);
}
document.getElementById('stereoLink').addEventListener('click',()=>setAudioStereoLinked(!audioStereoLinked));
function selectChannel(index){
 const channels=document.querySelectorAll('.channel:not([data-channel="master"])');
 channels.forEach(el=>{
  const selected=el.dataset.channel===String(index);
  el.classList.toggle('selected',selected);
  if(selected)el.setAttribute('aria-current','true');
  else el.removeAttribute('aria-current');
 });
 const status=document.getElementById('selectionStatus');
 const selectedTrack=document.querySelector('[data-channel="'+index+'"]');
 const titleEl=selectedTrack?.querySelector('.channel-title');
 const trackName=titleEl?.textContent?.trim()||labels[index];
 if(titleEl)titleEl.title=trackName;
 if(status)status.textContent='PISTE '+String(index+1).padStart(2,'0')+' · '+trackName;
 updateAudioDemoParameters();
}
function refreshMixVisibility(){
 const strips=[...document.querySelectorAll('.channel:not([data-channel="master"])')];
 const soloActive=strips.some(el=>state[Number(el.dataset.channel)].solo);
 strips.forEach(el=>{
  const d=state[Number(el.dataset.channel)];
  el.classList.toggle('mix-muted',d.mute);
  el.classList.toggle('mix-not-solo',soloActive&&!d.solo);
  el.setAttribute('aria-label','Tranche '+(Number(el.dataset.channel)+1)+' '+labels[Number(el.dataset.channel)]+(d.mute?' · mute actif':'')+(d.solo?' · solo actif':''));
 });
}
for(let i=0;i<16;i++)strips.appendChild(makeStrip(i));
document.getElementById('master').appendChild(makeStrip(0,true));
selectChannel(0);
let meterDemo=false;
let meterFrame=0;
let meterTimer=null;
const meterDemoButton=document.getElementById('meterDemo');
function renderMeter(el,peak,rms){
 const p=Math.max(0,Math.min(1,peak)),r=Math.max(0,Math.min(1,rms)),clipped=p>=0.999;
 const hold=Math.max(Number(el.dataset.peakHold||0),p);
 el.dataset.currentPeak=String(p);el.dataset.currentRms=String(r);el.dataset.peakHold=String(hold);
 const peakPercent=Math.round(p*100),rmsPercent=Math.round(r*100);
 const peakMeter=el.querySelector('[data-meter="peak"]').parentElement;
 peakMeter.setAttribute('aria-valuenow',String(peakPercent));peakMeter.setAttribute('aria-valuetext',peakPercent+' pour cent');
 el.querySelector('[data-meter="peak"]').style.width=(p*100).toFixed(1)+'%';
 el.querySelector('[data-meter-hold]').style.left=(hold*100).toFixed(1)+'%';
 el.dataset.clipLatched=String(el.dataset.clipLatched==='true'||clipped);
 const rmsMeter=el.querySelector('[data-meter="rms"]').parentElement;
 rmsMeter.setAttribute('aria-valuenow',String(rmsPercent));rmsMeter.setAttribute('aria-valuetext',rmsPercent+' pour cent');
 el.querySelector('[data-meter="rms"]').style.width=(r*100).toFixed(1)+'%';
 el.querySelector('[data-meter-value="peak"]').textContent=peakPercent+'%';
 el.querySelector('[data-meter-value="rms"]').textContent=rmsPercent+'%';
 const clip=el.querySelector('[data-clip]');const latched=el.dataset.clipLatched==='true';clip.textContent=latched?'CLIP':'OFF';clip.classList.toggle('active',latched);
 clip.setAttribute('aria-label',latched?'Écrêtage simulé mémorisé':'Écrêtage inactif');
}
function setMeterDemo(enabled){
 meterDemo=enabled;meterDemoButton.setAttribute('aria-pressed',String(enabled));
 meterDemoButton.textContent='DÉMO MÈTRES : '+(enabled?'ON':'OFF');
 if(meterTimer!==null){clearInterval(meterTimer);meterTimer=null}
 if(!enabled){
  document.querySelectorAll('.channel').forEach(el=>{el.dataset.peakHold='0';el.dataset.clipLatched='false';renderMeter(el,0,0)});
  return;
 }
 meterTimer=setInterval(()=>{
  meterFrame+=0.11;
  document.querySelectorAll('.channel').forEach((el,i)=>{
   const peak=0.48+0.49*Math.abs(Math.sin(meterFrame+i*0.73));
   const rms=peak*(0.48+0.18*Math.abs(Math.sin(meterFrame*0.61+i)));
   renderMeter(el,peak,rms);
  });
 },120);
}

meterDemoButton.addEventListener('click',()=>setMeterDemo(!meterDemo));

// Browser-only audible test signal. It deliberately does not connect to the
// MPC, native audio engine, ALSA, or any external device.
const audioDemoButton=document.getElementById('audioDemo');
function updateBrowserAudioMeters(){
 if(!audioAnalyser||!audioMeterBuffer)return;
 audioAnalyser.getFloatTimeDomainData(audioMeterBuffer);
 let peak=0,sumSquares=0;
 for(let i=0;i<audioMeterBuffer.length;i++){
  const sample=Math.max(-1,Math.min(1,audioMeterBuffer[i]));
  const magnitude=Math.abs(sample);
  if(magnitude>peak)peak=magnitude;
  sumSquares+=sample*sample;
 }
 const rms=Math.sqrt(sumSquares/audioMeterBuffer.length);
 const selected=document.querySelector('.channel.selected');
 const selectedIndex=selected?Number(selected.dataset.channel):0;
 const trackEl=document.querySelector('[data-channel="'+selectedIndex+'"]');
 const masterEl=document.querySelector('[data-channel="master"]');
 if(trackEl)renderMeter(trackEl,peak,rms);
 if(masterEl){
  const masterGain=masterState.mute?0:masterState.volume/100;
  renderMeter(masterEl,Math.min(1,peak*masterGain),rms*masterGain);
 }
}
function updateAudioDemoParameters(){
 if(!audioContext||!audioChannelGain||!audioPanner||!audioMasterGain)return;
 const selected=document.querySelector('.channel.selected');
 const index=selected?Number(selected.dataset.channel):0;
 const track=state[index]||state[0];
 const anySolo=state.some(item=>item.solo);
 const audible=!track.mute&&(!anySolo||track.solo)&&!masterState.mute;
 audioChannelGain.gain.value=audible?0.15*track.volume/100:0;
 audioPanner.pan.value=track.pan/100;
 audioMasterGain.gain.value=masterState.mute?0:masterState.volume/100;
}
function stopAudioDemo(){
 if(audioOscillator){try{audioOscillator.stop()}catch(error){}}
 if(audioContext){try{audioContext.close()}catch(error){}}
 if(audioMeterTimer!==null){clearInterval(audioMeterTimer);audioMeterTimer=null;}
 audioContext=null;audioOscillator=null;audioChannelGain=null;audioPanner=null;audioMasterGain=null;audioAnalyser=null;audioMeterBuffer=null;
 document.querySelectorAll('.channel').forEach(el=>{el.dataset.peakHold='0';el.dataset.clipLatched='false';renderMeter(el,0,0)});
 audioDemoButton.setAttribute('aria-pressed','false');
 audioDemoButton.textContent='SIGNAL AUDIO : OFF';
}
function startAudioDemo(){
 const AudioContextClass=window.AudioContext||window.webkitAudioContext;
 if(!AudioContextClass){
  audioDemoButton.textContent='AUDIO INDISPONIBLE';
  return;
 }
 try{
  audioContext=new AudioContextClass();
  audioOscillator=audioContext.createOscillator();
  audioChannelGain=audioContext.createGain();
  audioPanner=audioContext.createStereoPanner();
  audioMasterGain=audioContext.createGain();
  audioAnalyser=audioContext.createAnalyser();
  audioAnalyser.fftSize=2048;
  audioMeterBuffer=new Float32Array(audioAnalyser.fftSize);
  audioOscillator.type='sine';
  audioOscillator.frequency.value=220;
  audioOscillator.connect(audioChannelGain);
  audioChannelGain.connect(audioPanner);
  audioPanner.connect(audioMasterGain);
  audioMasterGain.connect(audioAnalyser);
  audioAnalyser.connect(audioContext.destination);
  updateAudioDemoParameters();
  audioOscillator.start();
  audioMeterTimer=setInterval(updateBrowserAudioMeters,50);
  if(audioContext.state==='suspended'&&audioContext.resume)audioContext.resume();
  audioDemoButton.setAttribute('aria-pressed','true');
  audioDemoButton.textContent='SIGNAL AUDIO : ON · 220 Hz';
 }catch(error){
  stopAudioDemo();
  audioDemoButton.textContent='AUDIO INDISPONIBLE';
 }
}
audioDemoButton.addEventListener('click',()=>{
 if(audioContext)stopAudioDemo();
 else startAudioDemo();
});

// Host-embedding seam only: a future native wrapper may dispatch this event
// after transferring a complete, validated 17-channel meter snapshot.
// This browser prototype does not create the native bridge or capture audio.
let lastExternalMeterSequence=-1;
window.addEventListener('mpc-meter-snapshot',event=>{
 const snapshot=event.detail;
 if(meterDemo)setMeterDemo(false);
 if(!snapshot||!Number.isSafeInteger(snapshot.sequence)||snapshot.sequence<=lastExternalMeterSequence||
    !Array.isArray(snapshot.channels)||snapshot.channels.length!==17)return;
 const valid=snapshot.channels.every(channel=>channel&&
   Number.isFinite(channel.peak)&&Number.isFinite(channel.rms)&&
   channel.peak>=0&&channel.peak<=1&&channel.rms>=0&&channel.rms<=1);
 if(!valid)return;
 lastExternalMeterSequence=snapshot.sequence;
 snapshot.channels.forEach((channel,index)=>{
  const el=document.querySelector('[data-channel="'+(index===16?'master':String(index))+'"]');
  if(el)renderMeter(el,channel.peak,channel.rms);
 });
});
let currentBank=0;
const bankStatus=document.getElementById('bankStatus');
const prevBank=document.getElementById('prev');
const nextBank=document.getElementById('next');
const scrollArea=document.getElementById('scrollArea');
function updateBankUi(){
 prevBank.disabled=currentBank===0;
 nextBank.disabled=currentBank===1;
 bankStatus.textContent='BANQUE '+(currentBank+1)+'/2 · PISTES '+(currentBank*8+1)+'–'+(currentBank*8+8);
 bankStatus.setAttribute('aria-label','Banque '+(currentBank+1)+' sur 2, pistes '+(currentBank*8+1)+' à '+(currentBank*8+8));
}
function setBank(bank){
 currentBank=Math.max(0,Math.min(1,bank));
 const firstTrack=strips.children[currentBank*8];
 if(firstTrack)scrollArea.scrollLeft=firstTrack.offsetLeft;
 updateBankUi();
}
scrollArea.addEventListener('scroll',()=>{
 const secondBankTrack=strips.children[8];
 if(secondBankTrack)currentBank=scrollArea.scrollLeft>=secondBankTrack.offsetLeft-1?1:0;
 updateBankUi();
});
prevBank.addEventListener('click',()=>setBank(currentBank-1));
nextBank.addEventListener('click',()=>setBank(currentBank+1));
setBank(0);
document.getElementById('reset').addEventListener('click',()=>{
 setMeterDemo(false);
 stopAudioDemo();
 state.forEach((s,i)=>Object.assign(s,defaults()));
 Object.assign(masterState,defaults());
 document.querySelectorAll('.channel').forEach(el=>{
  const idx=el.dataset.channel==='master'?null:Number(el.dataset.channel);
  const d=idx===null?masterState:state[idx];
  el.querySelector('[data-volume]').value=d.volume;el.querySelector('[data-pan]').value=d.pan;
  el.querySelectorAll('[data-eq]').forEach(x=>x.value=d.eq[Number(x.dataset.eq)]);
  el.querySelectorAll('[data-aux]').forEach(x=>x.value=d.aux[Number(x.dataset.aux)]);
  el.querySelectorAll('[data-toggle]').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});
  el.querySelectorAll('[data-insert-type]').forEach(x=>{const slot=Number(x.dataset.insertType);x.value=d.inserts[slot].type});
  el.querySelectorAll('[data-insert-drive]').forEach(x=>{const slot=Number(x.dataset.insertDrive);x.value=d.inserts[slot].drive});
  el.querySelectorAll('[data-insert-toggle]').forEach(x=>{const slot=Number(x.dataset.insertToggle);x.classList.toggle('off',!d.inserts[slot].enabled);x.textContent=d.inserts[slot].enabled?'ON':'OFF';x.setAttribute('aria-pressed',String(d.inserts[slot].enabled))});
  el.querySelectorAll('[data-insert-drive]').forEach(x=>x.dispatchEvent(new Event('input',{bubbles:true})));
  el.querySelectorAll('[data-insert-type]').forEach(x=>x.dispatchEvent(new Event('change',{bubbles:true})));
  el.querySelector('.db').textContent='0.0 dB';el.querySelector('.value').textContent='100 / 127';
  el.querySelectorAll('[data-eq]').forEach(x=>x.nextElementSibling.textContent='0.0');
  el.querySelectorAll('[data-aux]').forEach(x=>x.nextElementSibling.textContent='0');
  el.querySelector('[data-volume]').dispatchEvent(new Event('input',{bubbles:true}));
 });
 refreshMixVisibility();
});
</script>
