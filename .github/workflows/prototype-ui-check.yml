name: Prototype UI checks

on:
  push:
    branches: [feature/touch-mixer-ui]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-ui-check.yml"
  pull_request:
    branches: [feature/touch-mixer-ui]
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-ui-check.yml"

jobs:
  prototype-script:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract prototype JavaScript
        run: |
          node -e "const fs=require('fs'); const html=fs.readFileSync('prototype/index.html','utf8'); const scripts=[...html.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)]; if(!scripts.length) process.exit(1); fs.writeFileSync('/tmp/prototype.js', scripts[scripts.length-1][1]);"
      - name: Check JavaScript syntax
        run: node --check /tmp/prototype.js
