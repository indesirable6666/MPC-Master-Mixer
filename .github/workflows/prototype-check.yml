name: Prototype validation

on:
  workflow_dispatch:
  push:
    paths:
      - "prototype/**"
      - "tests/**"
      - ".github/workflows/prototype-check.yml"
  pull_request:
    paths:
      - "prototype/**"
      - ".github/workflows/prototype-check.yml"

permissions:
  contents: read

jobs:
  validate-prototype:
    runs-on: ubuntu-22.04
    container:
      image: node:20-bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install lightweight DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@26.1.0

      - name: Validate prototype structure and JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const html = fs.readFileSync('prototype/index.html', 'utf8');

          const required = [
            'id="strips"',
            'id="master"',
            'data-volume',
            'data-pan',
            'class="pan-value"',
            'const panLabel=panValue===0?\'C\':panValue<0?\'L \'+Math.abs(panValue):\'R \'+panValue',
            'data-eq',
            'data-aux',
            'data-toggle="',
            'MUTE',
            'SOLO',
            'MODE DÉMO',
            'SIMULATION LOCALE',
            'for(let i=0;i<16;i++)',
            'function makeStrip(index,isMaster=false)',
            'el.addEventListener(\'focus\'',
            'if(!isMaster&&!e.target.closest(\'input,button\'))selectChannel(index)',
            'if(!isMaster)selectChannel(index)',
            'const toggle=e.target.closest(\\'[data-toggle]\\');',
            'if(!isMaster)selectChannel(index);',
            'AUX ${n}'
          ];

          for (const token of required) {
            if (!html.includes(token)) {
              console.error('Missing required prototype feature:', token);
              process.exit(1);
            }
          }

          const ids = [...html.matchAll(/\bid="([^"]+)"/g)].map(match => match[1]);
          if (new Set(ids).size !== ids.length) {
            console.error('Duplicate static HTML id found.');
            process.exit(1);
          }

          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (scripts.length !== 1) {
            console.error('Expected exactly one inline application script.');
            process.exit(1);
          }

          fs.writeFileSync('/tmp/mpc-master-mixer-prototype.js', scripts[0][1]);
          cp.execFileSync(process.execPath, ['--check', '/tmp/mpc-master-mixer-prototype.js'], {stdio: 'inherit'});
          console.log('Prototype structure, unique IDs and inline JavaScript syntax checks passed.');
          NODE

      - name: Run prototype interaction tests
        run: node --test tests/prototype-interactions.test.cjs
