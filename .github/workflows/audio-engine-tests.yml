    paths:
      - "CMakeLists.txt"
      - "src/audio/**"
      - "src/mixer/**"
      - "tests/audio_engine_test.cpp"
      - "tests/audio_engine_solo_arbitration_test.cpp"
      - "tests/audio_insert_frequency_response_test.cpp"
      - "tests/audio_eq_frequency_response_test.cpp"
      - "tests/audio_insert_chain_test.cpp"
      - "tests/audio_eq_insert_chain_test.cpp"
      - "tests/audio_control_bridge_queue_lifecycle_test.cpp"
      - "tests/audio_aux_send_return_test.cpp"
      - "tests/audio_aux_control_bridge_test.cpp"
      - "tests/audio_control_bridge_queue_lifecycle_test.cpp"
      - "tests/mixer_controller_state_sequence_test.cpp"
      - "tests/mixer_mute_solo_order_test.cpp"
      - "tests/mixer_ui_command_dispatcher_test.cpp"
      - "tests/native_ui_command_adapter_test.cpp"
      - "tests/native_ui_frame_codec_test.cpp"
      - "tests/native_ui_unix_stream_io_test.cpp"
      - "tests/native_ui_session_gate_test.cpp"
      - "tests/native_ui_command_tracker_test.cpp"
      - "tests/meter_model_test.cpp"
      - "tests/audio_block_meter_test.cpp"
      - "tests/audio_meter_snapshot_bridge_test.cpp"
      - "tests/audio_meter_snapshot_freshness_test.cpp"
      - "tests/audio_duplex_meter_tap_test.cpp"
      - "tests/audio_input_pair_host_test.cpp"
      - "tests/audio_meter_ui_consumer_test.cpp"
      - "tests/audio_meter_clip_reset_test.cpp"
      - "tests/meter_presentation_adapter_test.cpp"
      - "tests/audio_meter_end_to_end_test.cpp"
      - "tests/audio_native_signal_scenarios_test.cpp"
      - "tests/audio_signal_reference_test.cpp"
      - "tests/fixtures/audio_signal_reference.csv"
      - "tests/mixer_controller_test.cpp"
      - "tests/mixer_insert_effect_owner_test.cpp"
      - "tests/mixer_mute_solo_order_test.cpp"
      - "tests/mixer_presentation_snapshot_test.cpp"
      - "tests/mixer_presentation_all_tracks_test.cpp"
      - "tests/mixer_ui_command_dispatcher_test.cpp"
      - "tests/native_ui_command_adapter_test.cpp"
      - "tests/native_ui_session_gate_test.cpp"
      - "tests/native_ui_command_tracker_test.cpp"
      - "tools/audio-engine-benchmark.cpp"
      - ".github/workflows/audio-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure host CMake validation harness
        run: cmake -S . -B build/host -DCMAKE_BUILD_TYPE=Debug
      - name: Build host tests and benchmark
        run: cmake --build build/host --parallel 2
      - name: Run C++ host tests through CTest
        run: ctest --test-dir build/host --output-on-failure

      - name: Report worst-case v1 snapshot payload size
        run: ./build/host/native_ui_protocol_v1_snapshot_serializer_test
      - name: Compile all-track solo arbitration tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_engine_solo_arbitration_test.cpp -o audio-engine-solo-arbitration-test
      - name: Run all-track solo arbitration tests
        run: ./audio-engine-solo-arbitration-test
      - name: Compile audio engine tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic -Isrc/audio tests/audio_engine_test.cpp -o audio-engine-test
      - name: Run audio engine tests
        run: ./audio-engine-test
      - name: Compile insert frequency-response tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_insert_frequency_response_test.cpp -o audio-insert-frequency-response-test
      - name: Run insert frequency-response tests
        run: ./audio-insert-frequency-response-test
      - name: Compile EQ frequency-response tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_eq_frequency_response_test.cpp -o audio-eq-frequency-response-test
      - name: Run EQ frequency-response tests
        run: ./audio-eq-frequency-response-test
      - name: Compile insert chain behavior tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_insert_chain_test.cpp -o audio-insert-chain-test
      - name: Run insert chain behavior tests
        run: ./audio-insert-chain-test
      - name: Compile combined EQ and insert chain tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_eq_insert_chain_test.cpp -o audio-eq-insert-chain-test
      - name: Run combined EQ and insert chain tests
        run: ./audio-eq-insert-chain-test
      - name: Compile Aux send and return tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_aux_send_return_test.cpp -o audio-aux-send-return-test
      - name: Run Aux send and return tests
        run: ./audio-aux-send-return-test
      - name: Compile Aux control bridge tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_aux_control_bridge_test.cpp -o audio-aux-control-bridge-test
      - name: Run Aux control bridge tests
        run: ./audio-aux-control-bridge-test
      - name: Compile SPSC bridge queue lifecycle tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_control_bridge_queue_lifecycle_test.cpp -o audio-control-bridge-queue-lifecycle-test
      - name: Run SPSC bridge queue lifecycle tests
        run: ./audio-control-bridge-queue-lifecycle-test
      - name: Compile Mute/Solo command ordering tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/mixer_mute_solo_order_test.cpp -o mixer-mute-solo-order-test
      - name: Run Mute/Solo command ordering tests
        run: ./mixer-mute-solo-order-test
      - name: Compile mixer controller state sequence tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/mixer_controller_state_sequence_test.cpp -o mixer-controller-state-sequence-test
      - name: Run mixer controller state sequence tests
        run: ./mixer-controller-state-sequence-test
      - name: Compile audio block meter tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_block_meter_test.cpp -o audio-block-meter-test
      - name: Run audio block meter tests
        run: ./audio-block-meter-test
      - name: Compile audio meter snapshot freshness tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_snapshot_freshness_test.cpp -o audio-meter-snapshot-freshness-test
      - name: Run audio meter snapshot freshness tests
        run: ./audio-meter-snapshot-freshness-test
      - name: Compile audio meter snapshot bridge tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_snapshot_bridge_test.cpp -o audio-meter-snapshot-bridge-test
      - name: Run audio meter snapshot bridge tests
        run: ./audio-meter-snapshot-bridge-test
      - name: Compile duplex meter tap tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_duplex_meter_tap_test.cpp -o audio-duplex-meter-tap-test
      - name: Run duplex meter tap tests
        run: ./audio-duplex-meter-tap-test
      - name: Compile stereo Audio In pair host tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_input_pair_host_test.cpp -o audio-input-pair-host-test
      - name: Run stereo Audio In pair host tests
        run: ./audio-input-pair-host-test
      - name: Compile UI meter consumer tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_ui_consumer_test.cpp -o audio-meter-ui-consumer-test
      - name: Run UI meter consumer tests
        run: ./audio-meter-ui-consumer-test
      - name: Compile meter clip reset tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_clip_reset_test.cpp -o audio-meter-clip-reset-test
      - name: Run meter clip reset tests
        run: ./audio-meter-clip-reset-test
      - name: Compile meter presentation adapter tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/meter_presentation_adapter_test.cpp -o meter-presentation-adapter-test
      - name: Run meter presentation adapter tests
        run: ./meter-presentation-adapter-test
      - name: Compile end-to-end audio meter tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic -Isrc/audio tests/audio_meter_end_to_end_test.cpp -o audio-meter-end-to-end-test
      - name: Run end-to-end audio meter tests
        run: ./audio-meter-end-to-end-test
      - name: Compile native offline signal scenario tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_native_signal_scenarios_test.cpp -o audio-native-signal-scenarios-test
      - name: Run native offline signal scenario tests
        run: ./audio-native-signal-scenarios-test
      - name: Compile meter model tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/meter_model_test.cpp -o meter-model-test
      - name: Run meter model tests
        run: ./meter-model-test
      - name: Compile all-track mixer presentation tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/mixer_presentation_all_tracks_test.cpp -o mixer-presentation-all-tracks-test
      - name: Run all-track mixer presentation tests
        run: ./mixer-presentation-all-tracks-test
      - name: Compile mixer controller tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/mixer_controller_test.cpp -o mixer-controller-test
      - name: Run mixer controller tests
        run: ./mixer-controller-test
      - name: Record host runner details
        run: |
          uname -a
          lscpu
      - name: Compile host DSP benchmark
        run: g++ -O3 -DNDEBUG -std=c++14 -Wall -Wextra -Werror -pedantic tools/audio-engine-benchmark.cpp -o audio-engine-benchmark
      - name: Run host DSP benchmark
        run: ./audio-engine-benchmark
