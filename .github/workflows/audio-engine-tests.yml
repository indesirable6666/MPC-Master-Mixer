name: Audio engine tests

on:
  push:
    paths:
      - "src/audio/**"
      - "src/mixer/**"
      - "tests/audio_engine_test.cpp"
      - "tests/meter_model_test.cpp"
      - "tests/audio_block_meter_test.cpp"
      - "tests/audio_meter_snapshot_bridge_test.cpp"
      - "tests/audio_duplex_meter_tap_test.cpp"
      - "tests/audio_meter_ui_consumer_test.cpp"
      - "tests/mixer_controller_test.cpp"
      - "tools/audio-engine-benchmark.cpp"
      - ".github/workflows/audio-engine-tests.yml"
  pull_request:
    paths:
      - "src/audio/**"
      - "src/mixer/**"
      - "tests/audio_engine_test.cpp"
      - "tests/meter_model_test.cpp"
      - "tests/audio_meter_snapshot_bridge_test.cpp"
      - "tools/audio-engine-benchmark.cpp"
      - ".github/workflows/audio-engine-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile audio engine tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic -Isrc/audio tests/audio_engine_test.cpp -o audio-engine-test
      - name: Run audio engine tests
        run: ./audio-engine-test
      - name: Compile audio block meter tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_block_meter_test.cpp -o audio-block-meter-test
      - name: Run audio block meter tests
        run: ./audio-block-meter-test
      - name: Compile audio meter snapshot bridge tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_snapshot_bridge_test.cpp -o audio-meter-snapshot-bridge-test
      - name: Run audio meter snapshot bridge tests
        run: ./audio-meter-snapshot-bridge-test
      - name: Compile duplex meter tap tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_duplex_meter_tap_test.cpp -o audio-duplex-meter-tap-test
      - name: Run duplex meter tap tests
        run: ./audio-duplex-meter-tap-test
      - name: Compile UI meter consumer tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/audio_meter_ui_consumer_test.cpp -o audio-meter-ui-consumer-test
      - name: Run UI meter consumer tests
        run: ./audio-meter-ui-consumer-test
      - name: Compile meter model tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/meter_model_test.cpp -o meter-model-test
      - name: Run meter model tests
        run: ./meter-model-test
      - name: Compile mixer controller tests
        run: g++ -std=c++14 -Wall -Wextra -Werror -pedantic tests/mixer_controller_test.cpp -o mixer-controller-test
      - name: Run mixer controller tests
        run: ./mixer-controller-test
      - name: Compile host DSP benchmark
        run: g++ -O3 -DNDEBUG -std=c++14 -Wall -Wextra -Werror -pedantic tools/audio-engine-benchmark.cpp -o audio-engine-benchmark
      - name: Run host DSP benchmark
        run: ./audio-engine-benchmark
