name: ARMv7 toolchain check

on:
  workflow_dispatch:
  push:
    paths:
      - "CMakeLists.txt"
      - "tools/arm-probe/**"
      - "src/audio/**"
      - "src/mixer/**"
      - "third_party/nlohmann/**"
      - "tests/audio_engine_test.cpp"
      - "tests/audio_output_headroom_test.cpp"
      - "tests/meter_model_test.cpp"
      - "tests/audio_block_meter_test.cpp"
      - "tests/audio_meter_snapshot_bridge_test.cpp"
      - "tests/audio_duplex_meter_tap_test.cpp"
      - "tests/audio_input_pair_host_test.cpp"
      - "tests/audio_duplex_aux_output_test.cpp"
      - "tests/audio_control_bridge_queue_lifecycle_test.cpp"
      - "tests/audio_native_signal_scenarios_test.cpp"
      - "tests/audio_signal_reference_test.cpp"
      - "tests/audio_meter_ui_consumer_test.cpp"
      - "tests/meter_presentation_adapter_test.cpp"
      - "tests/audio_meter_end_to_end_test.cpp"
      - "tests/mixer_controller_test.cpp"
      - "tests/mixer_insert_effect_owner_test.cpp"
      - "tests/mixer_presentation_snapshot_test.cpp"
      - "tests/mixer_ui_command_dispatcher_test.cpp"
      - "tests/native_ui_command_adapter_test.cpp"
      - "tests/native_ui_session_gate_test.cpp"
      - "tests/native_ui_session_coordinator_test.cpp"
      - "tests/native_ui_command_tracker_test.cpp"
      - "tests/native_ui_connection_epoch_test.cpp"
      - "tests/native_ui_json_decoder_test.cpp"
      - "tests/native_ui_frame_codec_test.cpp"
      - "tests/native_ui_unix_stream_io_test.cpp"
      - "tests/native_ui_unix_stream_frame_channel_test.cpp"
      - "tests/native_ui_unix_stream_connection_lifecycle_test.cpp"
      - "tests/native_ui_unix_stream_protocol_integration_test.cpp"
      - "tests/native_ui_unix_stream_protocol_driver_test.cpp"
      - "tests/native_ui_unix_socket_descriptor_test.cpp"
      - "tests/native_ui_unix_socket_path_policy_test.cpp"
      - "tests/native_ui_protocol_v1_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_client_message_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_response_serializer_test.cpp"
      - "tests/native_ui_protocol_v1_snapshot_serializer_test.cpp"
      - "tests/native_ui_protocol_v1_snapshot_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_snapshot_request_tracker_test.cpp"
      - "tests/native_ui_protocol_v1_command_processor_test.cpp"
      - "tests/native_ui_protocol_v1_session_integration_test.cpp"
      - "tools/audio-engine-benchmark.cpp"
      - ".github/workflows/armv7-toolchain.yml"
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "tools/arm-probe/**"
      - "src/audio/**"
      - "src/mixer/**"
      - "third_party/nlohmann/**"
      - "tests/audio_engine_test.cpp"
      - "tests/audio_output_headroom_test.cpp"
      - "tests/meter_model_test.cpp"
      - "tests/audio_block_meter_test.cpp"
      - "tests/audio_meter_snapshot_bridge_test.cpp"
      - "tests/audio_duplex_meter_tap_test.cpp"
      - "tests/audio_input_pair_host_test.cpp"
      - "tests/audio_duplex_aux_output_test.cpp"
      - "tests/audio_control_bridge_queue_lifecycle_test.cpp"
      - "tests/audio_native_signal_scenarios_test.cpp"
      - "tests/audio_signal_reference_test.cpp"
      - "tests/audio_meter_ui_consumer_test.cpp"
      - "tests/meter_presentation_adapter_test.cpp"
      - "tests/audio_meter_end_to_end_test.cpp"
      - "tests/mixer_controller_test.cpp"
      - "tests/mixer_insert_effect_owner_test.cpp"
      - "tests/mixer_presentation_snapshot_test.cpp"
      - "tests/mixer_ui_command_dispatcher_test.cpp"
      - "tests/native_ui_command_adapter_test.cpp"
      - "tests/native_ui_session_gate_test.cpp"
      - "tests/native_ui_json_decoder_test.cpp"
      - "tests/native_ui_frame_codec_test.cpp"
      - "tests/native_ui_unix_stream_io_test.cpp"
      - "tests/native_ui_unix_stream_frame_channel_test.cpp"
      - "tests/native_ui_unix_stream_protocol_integration_test.cpp"
      - "tests/native_ui_unix_stream_protocol_driver_test.cpp"
      - "tests/native_ui_unix_socket_descriptor_test.cpp"
      - "tests/native_ui_unix_socket_path_policy_test.cpp"
      - "tests/native_ui_protocol_v1_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_client_message_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_response_serializer_test.cpp"
      - "tests/native_ui_protocol_v1_snapshot_serializer_test.cpp"
      - "tests/native_ui_protocol_v1_snapshot_decoder_test.cpp"
      - "tests/native_ui_protocol_v1_session_integration_test.cpp"
      - "tests/native_ui_command_tracker_test.cpp"
      - "tests/native_ui_connection_epoch_test.cpp"
      - "tests/native_ui_session_coordinator_test.cpp"
      - "tools/audio-engine-benchmark.cpp"
      - ".github/workflows/armv7-toolchain.yml"

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-22.04
    container:
      image: debian:bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian Bullseye ARM hard-float toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf file

      - name: Compile ARMv7 C, C++ and graphics loader probes
        run: |
          mkdir -p build
          COMMON_FLAGS="-O2 -Wall -Wextra -Werror -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"

          arm-linux-gnueabihf-gcc $COMMON_FLAGS \
            tools/arm-probe/probe.c -o build/mpc-arm-probe-c

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/probe.cpp -o build/mpc-arm-probe-cpp

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/graphics-load-probe.cpp -ldl \
            -o build/mpc-arm-graphics-probe-v2

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/egl-client-extension-probe.cpp -ldl \
            -o build/mpc-arm-egl-client-extension-probe

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/egl-gbm-symbol-probe.cpp -ldl \
            -o build/mpc-arm-egl-gbm-symbol-probe

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/gles2-symbol-probe.cpp -ldl \
            -o build/mpc-arm-gles2-symbol-probe

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/egl-offscreen-pbuffer-probe.cpp -ldl \
            -o build/mpc-arm-egl-offscreen-pbuffer-probe

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            -Isrc/audio tests/audio_engine_test.cpp \
            -o build/mpc-audio-engine-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_output_headroom_test.cpp \
            -o build/mpc-audio-output-headroom-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_input_pair_host_test.cpp \
            -o build/mpc-audio-input-pair-host-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_duplex_aux_output_test.cpp \
            -o build/mpc-audio-duplex-aux-output-test-armv7
          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_control_bridge_queue_lifecycle_test.cpp \
            -o build/mpc-audio-control-bridge-queue-lifecycle-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_native_signal_scenarios_test.cpp \
            -o build/mpc-audio-native-signal-scenarios-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_signal_reference_test.cpp \
            -o build/mpc-audio-signal-reference-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/audio-engine-benchmark.cpp \
            -o build/mpc-audio-engine-benchmark-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_block_meter_test.cpp \
            -o build/mpc-audio-block-meter-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_meter_snapshot_bridge_test.cpp \
            -o build/mpc-audio-meter-snapshot-bridge-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_duplex_meter_tap_test.cpp \
            -o build/mpc-audio-duplex-meter-tap-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_meter_ui_consumer_test.cpp \
            -o build/mpc-audio-meter-ui-consumer-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/meter_presentation_adapter_test.cpp \
            -o build/mpc-meter-presentation-adapter-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/audio_meter_end_to_end_test.cpp \
            -o build/mpc-audio-meter-end-to-end-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/meter_model_test.cpp \
            -o build/mpc-meter-model-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/mixer_controller_test.cpp \
            -o build/mpc-mixer-controller-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/native_ui_command_adapter_test.cpp \
            -o build/mpc-native-ui-command-adapter-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/native_ui_command_tracker_test.cpp \
            -o build/mpc-native-ui-command-tracker-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/native_ui_connection_epoch_test.cpp \
            -o build/mpc-native-ui-connection-epoch-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/native_ui_session_gate_test.cpp \
            -o build/mpc-native-ui-session-gate-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/native_ui_session_coordinator_test.cpp \
            -o build/mpc-native-ui-session-coordinator-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_json_decoder_test.cpp \
            -o build/mpc-native-ui-json-decoder-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_frame_codec_test.cpp \
            -o build/mpc-native-ui-frame-codec-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_stream_io_test.cpp \
            -o build/mpc-native-ui-unix-stream-io-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_stream_frame_channel_test.cpp \
            -o build/mpc-native-ui-unix-stream-frame-channel-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_stream_connection_lifecycle_test.cpp \
            -o build/mpc-native-ui-unix-stream-connection-lifecycle-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_stream_protocol_driver_test.cpp \
            -o build/mpc-native-ui-unix-stream-protocol-driver-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_socket_descriptor_test.cpp \
            -o build/mpc-native-ui-unix-socket-descriptor-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_unix_socket_path_policy_test.cpp \
            -o build/mpc-native-ui-unix-socket-path-policy-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_decoder_test.cpp \
            -o build/mpc-native-ui-protocol-v1-decoder-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_client_message_decoder_test.cpp \
            -o build/mpc-native-ui-protocol-v1-client-message-decoder-test-armv7
          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_response_serializer_test.cpp \
            -o build/mpc-native-ui-protocol-v1-response-serializer-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_snapshot_serializer_test.cpp \
            -o build/mpc-native-ui-protocol-v1-snapshot-serializer-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_snapshot_decoder_test.cpp \
            -o build/mpc-native-ui-protocol-v1-snapshot-decoder-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_snapshot_request_tracker_test.cpp \
            -o build/mpc-native-ui-protocol-v1-snapshot-request-tracker-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_client_message_handler_test.cpp \
            -o build/mpc-native-ui-protocol-v1-client-message-handler-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_snapshot_delivery_test.cpp \
            -o build/mpc-native-ui-protocol-v1-snapshot-delivery-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_command_processor_test.cpp \
            -o build/mpc-native-ui-protocol-v1-command-processor-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 -Isrc/mixer \
            tests/native_ui_protocol_v1_session_integration_test.cpp \
            -o build/mpc-native-ui-protocol-v1-session-integration-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/mixer_insert_effect_owner_test.cpp \
            -o build/mpc-mixer-insert-effect-owner-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/mixer_presentation_snapshot_test.cpp \
            -o build/mpc-mixer-presentation-snapshot-test-armv7

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tests/mixer_ui_command_dispatcher_test.cpp \
            -o build/mpc-mixer-ui-command-dispatcher-test-armv7

          echo "=== C executable ==="
          file build/mpc-arm-probe-c
          arm-linux-gnueabihf-readelf -h build/mpc-arm-probe-c
          arm-linux-gnueabihf-readelf -l build/mpc-arm-probe-c | grep interpreter || true

          echo "=== C++ executable ==="
          file build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -h build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -A build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -l build/mpc-arm-probe-cpp | grep interpreter || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-probe-cpp

          echo "=== Graphics loader probe v2 ==="
          file build/mpc-arm-graphics-probe-v2
          arm-linux-gnueabihf-readelf -h build/mpc-arm-graphics-probe-v2
          arm-linux-gnueabihf-readelf -l build/mpc-arm-graphics-probe-v2 | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-graphics-probe-v2 | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-graphics-probe-v2

          echo "=== EGL client extension probe ==="
          file build/mpc-arm-egl-client-extension-probe
          arm-linux-gnueabihf-readelf -h build/mpc-arm-egl-client-extension-probe
          arm-linux-gnueabihf-readelf -l build/mpc-arm-egl-client-extension-probe | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-egl-client-extension-probe | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-egl-client-extension-probe

          echo "=== EGL/GBM symbol capability probe ==="
          file build/mpc-arm-egl-gbm-symbol-probe
          arm-linux-gnueabihf-readelf -h build/mpc-arm-egl-gbm-symbol-probe
          arm-linux-gnueabihf-readelf -l build/mpc-arm-egl-gbm-symbol-probe | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-egl-gbm-symbol-probe | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-egl-gbm-symbol-probe

          echo "=== GLES2 symbol capability probe ==="
          file build/mpc-arm-gles2-symbol-probe
          arm-linux-gnueabihf-readelf -h build/mpc-arm-gles2-symbol-probe
          arm-linux-gnueabihf-readelf -l build/mpc-arm-gles2-symbol-probe | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-gles2-symbol-probe | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-gles2-symbol-probe

          echo "=== EGL offscreen pbuffer probe ==="
          file build/mpc-arm-egl-offscreen-pbuffer-probe
          arm-linux-gnueabihf-readelf -h build/mpc-arm-egl-offscreen-pbuffer-probe
          arm-linux-gnueabihf-readelf -l build/mpc-arm-egl-offscreen-pbuffer-probe | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-egl-offscreen-pbuffer-probe | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-egl-offscreen-pbuffer-probe

          echo "=== Cross-toolchain runtime library locations ==="
          arm-linux-gnueabihf-g++ -print-file-name=libstdc++.so.6
          arm-linux-gnueabihf-g++ -print-file-name=libgcc_s.so.1
          arm-linux-gnueabihf-g++ -print-file-name=libc.so.6

          echo "=== Reject runtime requirements newer than the MPC ==="
          for binary in build/mpc-arm-probe-cpp build/mpc-arm-graphics-probe-v2 build/mpc-arm-egl-client-extension-probe build/mpc-arm-egl-gbm-symbol-probe build/mpc-arm-gles2-symbol-probe build/mpc-arm-egl-offscreen-pbuffer-probe build/mpc-audio-engine-test-armv7 build/mpc-audio-output-headroom-test-armv7 build/mpc-audio-engine-benchmark-armv7 build/mpc-meter-model-test-armv7 build/mpc-audio-block-meter-test-armv7 build/mpc-audio-meter-snapshot-bridge-test-armv7 build/mpc-audio-duplex-meter-tap-test-armv7 build/mpc-audio-meter-ui-consumer-test-armv7 build/mpc-meter-presentation-adapter-test-armv7 build/mpc-audio-meter-end-to-end-test-armv7 build/mpc-mixer-controller-test-armv7 build/mpc-native-ui-command-adapter-test-armv7 build/mpc-native-ui-command-tracker-test-armv7 build/mpc-native-ui-connection-epoch-test-armv7 build/mpc-native-ui-session-gate-test-armv7 build/mpc-native-ui-session-coordinator-test-armv7 build/mpc-native-ui-json-decoder-test-armv7 build/mpc-native-ui-frame-codec-test-armv7 build/mpc-native-ui-unix-stream-io-test-armv7 build/mpc-native-ui-unix-stream-frame-channel-test-armv7 build/mpc-native-ui-unix-stream-protocol-driver-test-armv7 build/mpc-native-ui-unix-socket-descriptor-test-armv7 build/mpc-native-ui-unix-socket-path-policy-test-armv7 build/mpc-native-ui-protocol-v1-decoder-test-armv7 build/mpc-native-ui-protocol-v1-client-message-decoder-test-armv7 build/mpc-native-ui-protocol-v1-response-serializer-test-armv7 build/mpc-native-ui-protocol-v1-snapshot-serializer-test-armv7 build/mpc-native-ui-protocol-v1-snapshot-decoder-test-armv7 build/mpc-native-ui-protocol-v1-snapshot-request-tracker-test-armv7 build/mpc-native-ui-protocol-v1-client-message-handler-test-armv7 build/mpc-native-ui-protocol-v1-snapshot-delivery-test-armv7 build/mpc-native-ui-protocol-v1-command-processor-test-armv7 build/mpc-mixer-insert-effect-owner-test-armv7 build/mpc-audio-input-pair-host-test-armv7 build/mpc-audio-duplex-aux-output-test-armv7 build/mpc-audio-native-signal-scenarios-test-armv7 build/mpc-audio-signal-reference-test-armv7 build/mpc-mixer-presentation-snapshot-test-armv7 build/mpc-mixer-ui-command-dispatcher-test-armv7; do
            if arm-linux-gnueabihf-readelf --version-info "$binary" | \
              grep -E 'GLIBCXX_3\.4\.(29|[3-9][0-9])|GLIBC_2\.(33|[4-9][0-9])'; then
              echo "ERROR: $binary requires a newer runtime than the MPC audit found."
              exit 1
            fi
          done
          echo "No GLIBC newer than 2.32 or GLIBCXX newer than 3.4.28 was found."

      - name: Upload ARMv7 DSP benchmark binary
        uses: actions/upload-artifact@v4
        with:
          name: mpc-armv7-audio-engine-benchmark
          path: build/mpc-audio-engine-benchmark-armv7
          if-no-files-found: error

      - name: Upload ARMv7 audio block meter test binary
        uses: actions/upload-artifact@v4
        with:
          name: mpc-armv7-audio-block-meter-test
          path: build/mpc-audio-block-meter-test-armv7
          if-no-files-found: error

      - name: Upload ARMv7 audio meter snapshot bridge test binary
        uses: actions/upload-artifact@v4
        with:
          name: mpc-armv7-audio-meter-snapshot-bridge-test
          path: build/mpc-audio-meter-snapshot-bridge-test-armv7
          if-no-files-found: error

