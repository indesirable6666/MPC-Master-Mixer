name: ARMv7 toolchain check

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/arm-probe/**"
      - ".github/workflows/armv7-toolchain.yml"

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: ubuntu-22.04
    container:
      image: debian:bullseye
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Debian Bullseye ARM hard-float toolchain
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            binutils-arm-linux-gnueabihf file

      - name: Compile ARMv7 C, C++ and graphics loader probes
        run: |
          mkdir -p build
          COMMON_FLAGS="-O2 -Wall -Wextra -Werror -march=armv7-a -mfpu=neon-vfpv4 -mfloat-abi=hard"

          arm-linux-gnueabihf-gcc $COMMON_FLAGS \
            tools/arm-probe/probe.c -o build/mpc-arm-probe-c

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/probe.cpp -o build/mpc-arm-probe-cpp

          arm-linux-gnueabihf-g++ $COMMON_FLAGS -std=c++14 \
            tools/arm-probe/graphics-load-probe.cpp -ldl \
            -o build/mpc-arm-graphics-probe

          echo "=== C executable ==="
          file build/mpc-arm-probe-c
          arm-linux-gnueabihf-readelf -h build/mpc-arm-probe-c
          arm-linux-gnueabihf-readelf -l build/mpc-arm-probe-c | grep interpreter || true

          echo "=== C++ executable ==="
          file build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -h build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -A build/mpc-arm-probe-cpp
          arm-linux-gnueabihf-readelf -l build/mpc-arm-probe-cpp | grep interpreter || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-probe-cpp

          echo "=== Graphics loader probe ==="
          file build/mpc-arm-graphics-probe
          arm-linux-gnueabihf-readelf -h build/mpc-arm-graphics-probe
          arm-linux-gnueabihf-readelf -l build/mpc-arm-graphics-probe | grep interpreter || true
          arm-linux-gnueabihf-readelf -d build/mpc-arm-graphics-probe | grep -E 'NEEDED|RPATH|RUNPATH' || true
          arm-linux-gnueabihf-readelf --version-info build/mpc-arm-graphics-probe

          echo "=== Cross-toolchain runtime library locations ==="
          arm-linux-gnueabihf-g++ -print-file-name=libstdc++.so.6
          arm-linux-gnueabihf-g++ -print-file-name=libgcc_s.so.1
          arm-linux-gnueabihf-g++ -print-file-name=libc.so.6

          echo "=== Reject runtime requirements newer than the MPC ==="
          for binary in build/mpc-arm-probe-cpp build/mpc-arm-graphics-probe; do
            if arm-linux-gnueabihf-readelf --version-info "$binary" | \
              grep -E 'GLIBCXX_3\.4\.(29|[3-9][0-9])|GLIBC_2\.(33|[4-9][0-9])'; then
              echo "ERROR: $binary requires a newer runtime than the MPC audit found."
              exit 1
            fi
          done
          echo "No GLIBC newer than 2.32 or GLIBCXX newer than 3.4.28 was found."

      - name: Upload probe binaries
        uses: actions/upload-artifact@v4
        with:
          name: mpc-armv7-runtime-probes
          path: |
            build/mpc-arm-probe-c
            build/mpc-arm-probe-cpp
            build/mpc-arm-graphics-probe
          if-no-files-found: error
